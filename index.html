<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READMEdev - Generator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Marked.js library live markdown rendering ke liye -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  
  <header class="header">
    <h1>🚀 READMEdev</h1>
    <p>Create beautiful README.md files for your repositories instantly.</p>
  </header>

  <main class="container">
    <!-- Left Column: Form Inputs -->
    <section class="form-section">
      <h2>Edit Details</h2>

      <div class="form-group">
        <label for="projectTitle">Project Title</label>
        <input type="text" id="projectTitle" placeholder="e.g., Awesome Web App">
      </div>

      <div class="form-group">
        <label for="projectDesc">Short Description</label>
        <textarea id="projectDesc" rows="3" placeholder="Briefly describe what your project does..."></textarea>
      </div>

      <div class="form-group">
        <label>Select Badges</label>
        <div class="badges-option">
          <label><input type="checkbox" class="badge-check" value="license"> License (MIT)</label>
          <label><input type="checkbox" class="badge-check" value="build"> Build Status</label>
          <label><input type="checkbox" class="badge-check" value="version"> Version (v1.0.0)</label>
        </div>
      </div>

      <div class="form-group">
        <label for="techStack">Technologies Used (Comma separated)</label>
        <input type="text" id="techStack" placeholder="e.g., HTML, CSS, JavaScript, React">
      </div>

      <div class="form-group">
        <label for="installation">Installation Steps</label>
        <textarea id="installation" rows="3" placeholder="npm install my-app"></textarea>
      </div>

      <div class="form-group">
        <label for="usage">Usage Examples</label>
        <textarea id="usage" rows="3" placeholder="npm start"></textarea>
      </div>

      <div class="form-group">
        <label for="license">License</label>
        <select id="license">
          <option value="MIT">MIT License</option>
          <option value="Apache-2.0">Apache 2.0</option>
          <option value="GPL-3.0">GPL v3</option>
          <option value="None">None</option>
        </select>
      </div>
    </section>

    <!-- Right Column: Live Preview & Markdown Output -->
    <section class="preview-section">
      <div class="preview-header">
        <div class="tabs">
          <button id="tabPreview" class="tab-btn active">Live Preview</button>
          <button id="tabMarkdown" class="tab-btn">Raw Markdown</button>
        </div>
        <div class="actions">
          <button id="copyBtn" class="btn secondary">📋 Copy Markdown</button>
          <button id="downloadBtn" class="btn primary">📥 Download .md</button>
        </div>
      </div>

      <!-- Live Rendered HTML -->
      <div id="previewContainer" class="preview-box"></div>

      <!-- Raw Markdown String -->
      <textarea id="markdownContainer" class="preview-box hidden" readonly></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
